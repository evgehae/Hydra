name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подключить usque и проверить Go-ядро
        run: |
          GODIR="$(dirname "$(find . -name go.mod -not -path './app/*' | head -1)")"
          cd "$GODIR"
          go get github.com/inipew/usque@v1.3.1
          # replace-директивы usque не наследуются зависимыми модулями — переносим их сами
          curl -fsSL https://raw.githubusercontent.com/inipew/usque/v1.3.1/go.mod -o /tmp/usque.mod || true
          if [ -s /tmp/usque.mod ]; then
            go mod edit -json /tmp/usque.mod | jq -r '.Replace[]? | select((.New.Version // "") != "") | "\(.Old.Path)\(if (.Old.Version // "") != "" then "@" + .Old.Version else "" end)=\(.New.Path)@\(.New.Version)"' | while read -r r; do echo "replace $r"; go mod edit -replace "$r"; done
          fi
          go mod tidy
          go vet -tags usque ./...
          go test -tags usque ./...

      - name: Собрать Go-ядро в AAR
        run: |
          GODIR="$(dirname "$(find . -name go.mod -not -path './app/*' | head -1)")"
          mkdir -p app/libs
          OUT="$PWD/app/libs/hydra.aar"
          cd "$GODIR"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go get golang.org/x/mobile/bind
          gomobile bind -tags usque -target=android/arm,android/arm64 -androidapi 26 -o "$OUT" ./mobile

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Подготовить release keystore
        env:
          HYDRA_KEYSTORE_BASE64: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HYDRA_KEYSTORE_BASE64" ]; then
            echo "::error::Секрет HYDRA_KEYSTORE_BASE64 не задан. См. SIGNING.md"
            exit 1
          fi
          echo "$HYDRA_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/hydra-release.jks"
          ls -la "$GITHUB_WORKSPACE/hydra-release.jks"

      - name: Собрать signed release APK
        env:
          HYDRA_KEYSTORE_FILE: ${{ github.workspace }}/hydra-release.jks
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
        run: |
          test -n "$HYDRA_KEYSTORE_PASSWORD"
          test -n "$HYDRA_KEY_ALIAS"
          test -n "$HYDRA_KEY_PASSWORD"
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          # единое имя для UpdateChecker и артефактов
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "Hydra-v${{ github.run_number }}.apk"
          ls -la "Hydra-v${{ github.run_number }}.apk"
          # проверка, что APK подписан
          jarsigner -verify "Hydra-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-release-apk
          path: Hydra-v${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hydra build ${{ github.run_number }}
          body: |
            Автосборка #${{ github.run_number }} (signed release)
            versionCode=${{ github.run_number }}
            Установи этот APK или дождись окна обновления в приложении.
            Подпись постоянная — обновление поверх предыдущей release-сборки без удаления.
          files: Hydra-v${{ github.run_number }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
